<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasLang JS Interpreter Test Harness</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; background-color: #1e1e1e; color: #d4d4d4; }
        .header { margin-bottom: 20px; }
        .main-content { display: flex; flex: 1; gap: 20px; overflow: hidden; }
        .panel { flex: 1; display: flex; flex-direction: column; background: #2d2d2d; border: 1px solid #444; border-radius: 8px; padding: 15px; overflow: auto; }
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: monospace; border: 1px solid #555; padding: 10px; resize: none; margin-bottom: 10px; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0098ff; }
        
        /* Mock DOM Styles */
        .mock-dom { background: white; color: black; padding: 20px; border-radius: 4px; flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .error-row { background-color: #ffebee; }
        
        #console-output { background: #000; color: #0f0; font-family: monospace; padding: 10px; margin-top: 20px; height: 150px; overflow-y: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>CasLang JS Engine - Test Playground</h2>
    </div>
    
    <div class="main-content">
        <!-- Editor Panel -->
        <div class="panel">
            <h3>JSONL Script</h3>
            <textarea id="script-input">
{"op":"caslang","version":"0.3"}
{"op":"flow.set","name":"injected_html","mode":"block","nonce":"xyz890"}
<strong>Critical Alert:</strong>
<p>The CasLang Browser Engine successfully injected this multi-line raw HTML block directly into the DOM!</p>
{"op":"flow.end_set","name":"injected_html","nonce":"xyz890"}
{"op":"browser.query","selector":"#status-message","as":"statusBox"}
{"op":"browser.set_html","element":"${statusBox}","html":"${injected_html}"}
{"op":"browser.set_style","element":"${statusBox}","prop":"display","val":"block"}
{"op":"str.log","msg":"Successfully injected block HTML into the DOM!"}
{"op":"flow.return","value":"Injection Complete"}
</textarea>
            <button id="run-btn">Run Script</button>
        </div>

        <!-- Mock DOM Panel -->
        <div class="panel">
            <h3>Mock DOM</h3>
            <div class="mock-dom" id="mock-dom-root">
                <h4>System Logs Table</h4>
                <table id="log-table">
                    <thead><tr><th>ID</th><th>Message</th><th>Action</th></tr></thead>
                    <tbody>
                        <tr class="data-row"><td>1</td><td>System started</td><td><button class="delete-btn">Delete</button></td></tr>
                        <tr class="data-row error-row"><td>2</td><td>Error: Connection timeout</td><td><button class="delete-btn">Delete</button></td></tr>
                        <tr class="data-row"><td>3</td><td>User logged in</td><td><button class="delete-btn">Delete</button></td></tr>
                        <tr class="data-row error-row"><td>4</td><td>Error: Auth failed</td><td><button class="delete-btn">Delete</button></td></tr>
                    </tbody>
                </table>
                
                <h4>Interactive Elements</h4>
                <input type="text" id="search-box" placeholder="Type here...">
                <div id="status-message" style="margin-top: 10px; padding: 10px; background: #e0f7fa; display: none;"></div>

                <!-- Hidden State Data (Simulating Next.js / Nuxt) -->
                <script id="__NEXT_DATA__" type="application/json">
                    {"props":{"pageProps":{"user":{"id":999,"name":"Admin"}}}}
                </script>
            </div>
        </div>
    </div>
    
    <div id="console-output">Ready...</div>

    <!-- Load the Engine and App Logic -->
    <script src="../src/CasLangBrowserEngine.js"></script>
    <script src="app.js"></script>
</body>
</html>
