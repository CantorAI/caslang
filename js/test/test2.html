<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CasLang JS Interpreter Test Harness - Loop & If</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; background-color: #1e1e1e; color: #d4d4d4; }
        .header { margin-bottom: 20px; }
        .main-content { display: flex; flex: 1; gap: 20px; overflow: hidden; }
        .panel { flex: 1; display: flex; flex-direction: column; background: #2d2d2d; border: 1px solid #444; border-radius: 8px; padding: 15px; overflow: auto; }
        textarea { flex: 1; background: #1e1e1e; color: #d4d4d4; font-family: monospace; border: 1px solid #555; padding: 10px; resize: none; margin-bottom: 10px; white-space: pre; }
        button { background: #007acc; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #0098ff; }
        
        /* Mock DOM Styles */
        .mock-dom { background: white; color: black; padding: 20px; border-radius: 4px; flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .error-row { background-color: #ffebee; }
        
        #console-output { background: #000; color: #0f0; font-family: monospace; padding: 10px; margin-top: 20px; height: 150px; overflow-y: auto; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>CasLang JS Engine - Loop & If Test</h2>
    </div>
    
    <div class="main-content">
        <!-- Editor Panel -->
        <div class="panel">
            <h3>JSONL Script (Loop & If Test)</h3>
            <textarea id="script-input">
{"op":"caslang","version":"0.3"}
{"op":"str.print", "msg":"Starting Loop & If Test..."}
{"op":"browser.query_all", "selector":"table tr.data-row", "as":"rows"}
{"op":"flow.loop_start", "var":"row", "in":"${rows}"}
  {"op":"browser.get_text", "element":"${row}", "as":"rowText"}
  {"op":"str.contains", "s":"${rowText}", "sub":"Error", "as":"hasError"}
  {"op":"flow.if", "cond":"${hasError} == true"}
    {"op":"str.log", "msg":"Found error row: ${rowText}"}
    {"op":"browser.query", "element":"${row}", "selector":".delete-btn", "as":"btn"}
    {"op":"browser.click", "element":"${btn}"}
  {"op":"flow.endif"}
{"op":"flow.loop_end"}
{"op":"str.print", "msg":"Finished Loop & If Test."}
{"op":"flow.return", "value":"Deleted Error Rows!"}
</textarea>
            <button id="run-btn">Run Script</button>
        </div>

        <!-- Mock DOM Panel -->
        <div class="panel">
            <h3>Mock DOM</h3>
            <div class="mock-dom" id="mock-dom-root">
                <h4>System Logs Table</h4>
                <table id="log-table">
                    <thead><tr><th>ID</th><th>Message</th><th>Action</th></tr></thead>
                    <tbody>
                        <tr class="data-row"><td>1</td><td>System started</td><td><button class="delete-btn">Delete</button></td></tr>
                        <tr class="data-row error-row"><td>2</td><td>Error: Connection timeout</td><td><button class="delete-btn">Delete</button></td></tr>
                        <tr class="data-row"><td>3</td><td>User logged in</td><td><button class="delete-btn">Delete</button></td></tr>
                        <tr class="data-row error-row"><td>4</td><td>Error: Auth failed</td><td><button class="delete-btn">Delete</button></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="console-output">Ready...</div>

    <!-- Load the Engine and App Logic -->
    <script src="../src/CasLangBrowserEngine.js"></script>
    <script src="app.js"></script>
</body>
</html>
